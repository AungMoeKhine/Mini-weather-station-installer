    // ─── FISH CLASS WITH BIOLOGICAL STATES & RESPONSES ───
    class Fish {
      constructor(modelIndex, startX, startY) {
        this.modelIndex = modelIndex;
        this.model = FISH_MODELS[modelIndex];
        this.x = startX;
        this.y = startY;
        this.targetX = startX;
        this.targetY = startY;
        this.facingRight = Math.random() < 0.5;
        this.speed = this.model.speedMin;
        this.tilt = 0;
        this.pauseFrames = 0;
        this.postFeedCooldown = 0;
        this.stuckFrames = 0;
        this.lastBubbleTime = Date.now() + Math.random() * 3000;
        this.individualScale = 0.88 + Math.random() * 0.24;
        this.isClimbing = false;
        this.satiation = Math.floor(Math.random() * 2); // 0 = hungry, 3 = full
        this.lastPoopTime = Date.now() + Math.random() * 10000;

        this.el = document.createElement('div');
        this.el.className = 'fish-sprite';
        this.el.style.width = this.model.width + 'px';
        this.el.style.height = this.model.height + 'px';
        this.el.innerHTML = this.model.svg;
        tank.appendChild(this.el);

        this.el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (currentTool === 'feed') {
            this.dartAway(e.clientX, e.clientY);
            playSound('eat');
          }
        });

        this.pickNewTarget();
      }

      pickNewTarget() {
        const rect = tank.getBoundingClientRect();
        const waterHeight = rect.height * 0.94;

        // 1. Hypoxic State (Low Oxygen): Fish must rise to the surface to gasp for air
        if (currentO2 < 45 && this.model.type !== 'shrimp') {
          this.targetY = waterHeight - this.model.height - (4 + Math.random() * 18);
          this.targetX = 20 + Math.random() * (rect.width - this.model.width - 40);
          this.speed = 0.002 + Math.random() * 0.002;
          return;
        }

        // 2. Chilled State (Low Temperature): Fish huddle near the heater fixture (left)
        if (currentTemp < 21.5 && this.model.type !== 'shrimp') {
          const heaterX = Math.max(25, rect.width * 0.14);
          this.targetX = heaterX + (Math.random() * 70 - 25);
          this.targetY = 25 + Math.random() * (waterHeight * 0.45);
          this.speed = this.model.speedMin * 0.4;
          return;
        }

        // 3. Otocinclus Catfish Behavior (Hunts & Grazes Glass Algae Patches)
        if (this.model.type === 'otocinclus') {
          if (algaePatches.length > 0 && Math.random() < 0.75) {
            // Find closest algae patch
            let nearestPatch = null;
            let minDist = 9999;
            for (let p of algaePatches) {
              let d = Math.hypot(p.x - this.x, p.y - this.y);
              if (d < minDist) {
                minDist = d;
                nearestPatch = p;
              }
            }
            if (nearestPatch) {
              this.targetX = Math.max(15, Math.min(rect.width - 55, nearestPatch.x - 22));
              this.targetY = Math.max(16, Math.min(waterHeight - 25, nearestPatch.y - 10));
              this.speed = 0.0055;
              this.targetAlgae = nearestPatch;
              return;
            }
          }
          // Default: Glides along lower glass and gravel substrate
          this.targetAlgae = null;
          this.targetX = 15 + Math.random() * (rect.width - 65);
          this.targetY = 14 + Math.random() * (waterHeight * 0.45);
          this.speed = 0.0035 + Math.random() * 0.0025;
          return;
        }

        // 4. Red Cherry Shrimp Behavior (Plant Grazer)
        if (this.model.type === 'shrimp') {
          if (this.isClimbing) {
            const stayOnPlant = Math.random() < 0.65;
            if (stayOnPlant) {
              const isLeftPlant = this.x < rect.width * 0.5;
              this.targetX = isLeftPlant ? (10 + Math.random() * 70) : (rect.width - 85 + Math.random() * 65);
              this.targetY = 18 + Math.random() * 55;
            } else {
              this.isClimbing = false;
              this.targetX = this.x + (Math.random() * 40 - 20);
              this.targetY = 12 + Math.random() * 3;
            }
          } else {
            const startClimbing = Math.random() < 0.35;
            if (startClimbing) {
              this.isClimbing = true;
              const goLeft = this.x < rect.width * 0.5;
              this.targetX = goLeft ? (12 + Math.random() * 65) : (rect.width - 80 + Math.random() * 60);
              this.targetY = 18 + Math.random() * 45;
            } else {
              this.targetX = Math.max(12, Math.min(rect.width - 45, this.x + (Math.random() * 120 - 60)));
              this.targetY = 12 + Math.random() * 3;
            }
          }
          this.speed = 0.0022 + Math.random() * 0.0025;
          return;
        }

        // 5. Night / Darkness Sleep Rest & Torpor Mode (Lights Off)
        if (currentLightIndex === 3) {
          // Dragon Arowana: Obligate surface swimmer and surface air-breather.
          // Never rests on gravel; glides steadily and majestically across the upper water layer.
          if (this.model.type === 'arowana') {
            const midX = rect.width / 2;
            this.targetX = (this.x < midX) ? (midX + 25 + Math.random() * (midX - this.model.width - 45)) : (25 + Math.random() * (midX - 45));
            this.targetY = Math.max(35, waterHeight - this.model.height - 20 - Math.random() * 25);
            this.speed = 0.0018 + Math.random() * 0.0012;
            return;
          }

          // Otocinclus & Cherry Shrimp: Rest firmly on substrate or lower plant leaves
          if (this.model.type === 'otocinclus' || this.model.type === 'shrimp') {
            this.targetX = Math.max(15, Math.min(rect.width - 55, this.x + (Math.random() * 80 - 40)));
            this.targetY = 12 + Math.random() * 8;
            this.speed = 0.0015;
            this.targetAlgae = null;
            return;
          }

          // Diurnal Fish (Golden Fantail, Chinese Yuanbao, Angelfish, Tetras, Tiger Barbs, Clownfish):
          // Seek quiet bottom shelter zones (near plant thickets or lower substrate)
          const plantZoneLeft = Math.random() < 0.38;
          const plantZoneRight = Math.random() < 0.38;
          if (plantZoneLeft) {
            this.targetX = 25 + Math.random() * 80;
          } else if (plantZoneRight) {
            this.targetX = rect.width - 120 + Math.random() * 85;
          } else {
            this.targetX = 35 + Math.random() * (rect.width - this.model.width - 70);
          }
          this.targetY = 14 + Math.random() * 24; // Sheltered bottom 1/4 of tank
          this.speed = 0.0012 + Math.random() * 0.0014; // Slow, calm resting glide
          return;
        }

        // Standard Natural Cruising
        const midX = rect.width / 2;
        if (this.x < midX) {
          this.targetX = midX + 20 + Math.random() * (midX - this.model.width - 35);
        } else {
          this.targetX = 15 + Math.random() * (midX - 35);
        }

        if (this.model.isBottomDweller) {
          this.targetY = 14 + Math.random() * 24;
        } else if (this.model.isSurfaceDweller) {
          this.targetY = Math.max(30, waterHeight - this.model.height - 18 - Math.random() * 32);
        } else {
          const usableCeiling = Math.max(60, waterHeight - this.model.height - 45);
          this.targetY = 24 + Math.random() * usableCeiling;
        }

        let speedMultiplier = 1.0;
        if (currentTemp < 22) speedMultiplier *= 0.5;
        if (currentClarity < 50) speedMultiplier *= 0.7;

        this.speed = (this.model.speedMin + Math.random() * (this.model.speedMax - this.model.speedMin)) * speedMultiplier;
      }

      disperseImmediately() {
        const rect = tank.getBoundingClientRect();
        const waterHeight = rect.height * 0.94;

        this.postFeedCooldown = 180;
        this.pauseFrames = 0;
        this.targetOffsetAngle = undefined;

        if (this.model.type === 'shrimp') {
          this.isClimbing = Math.random() < 0.5;
          this.targetX = (this.x < rect.width * 0.5) ? (20 + Math.random() * 60) : (rect.width - 90 + Math.random() * 60);
          this.targetY = 12 + Math.random() * (this.isClimbing ? 45 : 4);
        } else {
          const swimToRight = (this.x < rect.width * 0.5);
          this.targetX = swimToRight
            ? (rect.width * 0.52 + Math.random() * (rect.width * 0.40))
            : (25 + Math.random() * (rect.width * 0.40));

          if (this.model.isBottomDweller) {
            this.targetY = 14 + Math.random() * 20;
          } else if (this.model.isSurfaceDweller) {
            this.targetY = waterHeight - this.model.height - 14 - Math.random() * 22;
          } else {
            this.targetY = 25 + Math.random() * (waterHeight - this.model.height - 55);
          }
        }
        this.speed = this.model.speedMin + Math.random() * (this.model.speedMax - this.model.speedMin);
      }

      dartAway(fromClientX, fromClientY) {
        const rect = tank.getBoundingClientRect();
        const localX = fromClientX - rect.left;

        if (this.model.type === 'shrimp') {
          this.targetX = localX > this.x ? Math.max(15, this.x - 140) : Math.min(rect.width - 45, this.x + 140);
          this.targetY = Math.min(80, this.y + 35 + Math.random() * 30);
          this.speed = 0.15;
          this.isClimbing = false;
          this.pauseFrames = 0;
          return;
        }

        this.targetX = localX > this.x ? Math.max(20, this.x - 180) : Math.min(rect.width - 50, this.x + 180);

        if (this.model.isBottomDweller) {
          this.targetY = 14 + Math.random() * 22;
          this.speed = 0.08;
        } else if (this.model.isSurfaceDweller) {
          this.targetY = (rect.height * 0.94) - this.model.height - 40;
          this.speed = 0.09;
        } else {
          this.targetY = Math.min((rect.height * 0.94) - 40, Math.max(16, this.y + (Math.random() * 120 - 60)));
          this.speed = 0.08;
        }
        this.pauseFrames = 0;
      }

      seekNearestFood() {
        if (this.postFeedCooldown > 0) return false;
        if (!foodList.length) return false;
        if (this.satiation >= 3) return false; // Full fish ignores excess pellets!

        let nearest = null;
        let minDist = 9999;
        for (let f of foodList) {
          if (this.model.type === 'shrimp' && f.y > 55) continue;
          let dist = Math.hypot(f.x - this.x, f.y - this.y);
          if (dist < minDist) {
            minDist = dist;
            nearest = f;
          }
        }

        if (nearest) {
          if (this.targetOffsetAngle === undefined) {
            this.targetOffsetAngle = Math.random() * Math.PI * 2;
          }
          const spreadRadius = 4 + (this.model.width * 0.15);
          this.targetX = nearest.x - (this.model.width / 2) + Math.cos(this.targetOffsetAngle) * spreadRadius;
          this.targetY = nearest.y + Math.sin(this.targetOffsetAngle) * (spreadRadius * 0.4);

          const sizeBoost = this.model.width > 80 ? 3.5 : 2.2;
          this.speed = this.model.speedMax * sizeBoost;
          this.pauseFrames = 0;
          return true;
        }
        this.targetOffsetAngle = undefined;
        return false;
      }

      update() {
        const rect = tank.getBoundingClientRect();
        if (this.postFeedCooldown > 0) this.postFeedCooldown--;

        const hasFood = this.seekNearestFood();
        const now = Date.now();

        // Realistic Fish Waste Digestion (Only poops after eating, spaced out over hours)
        const currentSpeed = PACING_MODES[pacingIndex].speed;
        const digestionInterval = (45 * 60 * 1000) / currentSpeed; // ~45 mins per dropping in real time
        if (this.satiation > 0 && (now - this.lastPoopTime > digestionInterval) && poopList.length < 8) {
          spawnPoop(this.x + this.model.width / 2, this.y);
          this.lastPoopTime = now;
          this.satiation--;
        }

        if (!hasFood && this.speed > this.model.speedMax) {
          this.speed += (this.model.speedMax - this.speed) * 0.08;
        }

        const isHypoxic = (currentO2 < 45 && this.model.type !== 'shrimp');
        if (isHypoxic && !this.el.classList.contains('hypoxic')) {
          this.el.classList.add('hypoxic');
        } else if (!isHypoxic && this.el.classList.contains('hypoxic')) {
          this.el.classList.remove('hypoxic');
        }

        if (this.pauseFrames > 0 && !hasFood) {
          this.pauseFrames--;
          if (currentLightIndex === 3) {
            // Biological torpor: subtle vertical respiration hovering and gentle fin drift
            this.y += Math.sin((now + this.x * 3) / 850) * 0.20;
            this.x += Math.cos((now + this.x * 2) / 1200) * 0.06;
          } else {
            this.y += Math.sin((now + this.x * 10) / 600) * 0.15;
          }
        } else {
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const dist = Math.hypot(dx, dy);

          const biteRange = 14 + (this.model.width * 0.25);
          if (hasFood && dist < biteRange) {
            eatFoodNear(this.x + this.model.width / 2, this.y, biteRange + 10);
            this.satiation++;
            this.disperseImmediately();
            playSound('eat');
          }

          // Otocinclus Grazing & Cleaning Algae
          if (this.model.type === 'otocinclus' && this.targetAlgae && dist < 22) {
            const patchIdx = algaePatches.indexOf(this.targetAlgae);
            if (patchIdx > -1) {
              // Latch onto glass and graze
              this.pauseFrames = 75;
              this.targetAlgae.radius = Math.max(0, this.targetAlgae.radius - 1.2);
              this.targetAlgae.el.style.transform = `scale(${(this.targetAlgae.radius / 20).toFixed(2)})`;
              if (this.targetAlgae.radius <= 4) {
                this.targetAlgae.el.remove();
                algaePatches.splice(patchIdx, 1);
                currentAlgae = Math.max(0, (algaePatches.length / 20) * 100);
                algaeOverlay.style.opacity = Math.min(1, currentAlgae / 60);
                updateTelemetry();
                updateStatus("Otocinclus catfish cleaned an algae patch off the glass!");
                playSound('scrape');
                this.targetAlgae = null;
              }
            }
          }

          if (dist < 12) {
            this.stuckFrames = 0;
            this.lastCheckPos = null;
            const isNight = (currentLightIndex === 3);
            const pauseChance = isNight ? 0.88 : ((this.model.type === 'shrimp') ? 0.75 : (this.postFeedCooldown > 0 ? 0 : 0.25));
            if (!hasFood && Math.random() < pauseChance) {
              if (isNight) {
                // Extended sleep torpor pause with calm respiration bobbing (3-8 seconds)
                this.pauseFrames = 180 + Math.floor(Math.random() * 300);
              } else {
                this.pauseFrames = (this.model.type === 'shrimp')
                  ? (140 + Math.floor(Math.random() * 220))
                  : (30 + Math.floor(Math.random() * 45));
              }
            } else {
              this.pickNewTarget();
            }
          } else {
            if (!this.lastCheckPos) {
              this.lastCheckPos = { x: this.x, y: this.y, frame: 0 };
            }
            this.lastCheckPos.frame++;
            if (this.lastCheckPos.frame > 210) {
              const movedDist = Math.hypot(this.x - this.lastCheckPos.x, this.y - this.lastCheckPos.y);
              if (movedDist < 3.0) {
                this.pickNewTarget();
              }
              this.lastCheckPos = { x: this.x, y: this.y, frame: 0 };
            }

            if (hasFood) {
              const step = Math.min(dist, 1.8 + (this.model.speedMax * 70));
              this.x += (dx / dist) * step;
              this.y += (dy / dist) * step;

              const turnThreshold = this.model.width * 0.1;
              if (Math.abs(dx) > Math.max(1.8, turnThreshold)) {
                this.facingRight = dx > 0;
              }

              let targetPitch = Math.atan2(dy, Math.abs(dx)) * (180 / Math.PI);
              let clampedPitch = Math.max(-40, Math.min(40, targetPitch));
              let flexFactor = this.model.width > 80 ? 0.06 : 0.12;
              this.tilt += (clampedPitch - this.tilt) * flexFactor;
            } else {
              const nightDampener = (currentLightIndex >= 2) ? 0.55 : 1.0;
              const coldDampener = (currentTemp < 22) ? 0.45 : 1.0;
              this.x += (dx * this.speed * nightDampener * coldDampener);
              this.y += (dy * this.speed * nightDampener * coldDampener);

              if (dx > 0.6) this.facingRight = true;
              else if (dx < -0.6) this.facingRight = false;

              let targetTilt = Math.max(-14, Math.min(14, dy * 0.22));
              if (isHypoxic) targetTilt = -25; // Tilt head upward to gasp
              this.tilt += (targetTilt - this.tilt) * 0.04;
            }
          }
        }

        const bubbleCooldown = this.speed > 0.04 ? 1800 : 5000;
        if (this.pauseFrames === 0 && (now - this.lastBubbleTime > bubbleCooldown) && Math.random() < 0.15) {
          spawnBubble(this.x + (this.facingRight ? this.model.width * 0.15 : this.model.width * 0.85), this.y + 4);
          this.lastBubbleTime = now;
        }

        const waterHeight = rect.height * 0.94;
        const minY = (this.model.type === 'shrimp') ? 12 : 16;
        const maxY = (this.model.type === 'shrimp' && !hasFood) ? 75 : (waterHeight - this.model.height - 8);

        this.x = Math.max(10, Math.min(rect.width - this.model.width - 10, this.x));
        this.y = Math.max(minY, Math.min(maxY, this.y));

        const isChineseGold = (this.model.type === 'chinese_goldfish');
        const isClown = (this.model.type === 'clownfish');
        const isBarb = (this.model.type === 'tiger_barb');
        const isArowana = (this.model.type === 'arowana');

        const isNight = (currentLightIndex === 3);
        let waveBounce = 0;
        if (!hasFood && this.model.type !== 'shrimp') {
          if (isNight) {
            // Calm, rhythmic gill respiration micro-bobbing while resting at night
            waveBounce = Math.sin((now + this.x * 4) / 750) * 0.75;
          } else {
            if (isChineseGold) waveBounce = Math.sin((now + this.x * 5) / 500) * 3.2;
            else if (isClown) waveBounce = Math.sin((now + this.x * 9) / 280) * 1.8;
            else if (isBarb) waveBounce = Math.sin((now + this.x * 11) / 220) * 1.6;
            else if (isArowana) waveBounce = Math.sin((now + this.x * 4) / 460) * 1.2;
            else waveBounce = Math.sin((now + this.x * 7) / 340) * 1.5;
          }
        }

        const flip = this.facingRight ? "scaleX(-1)" : "scaleX(1)";
        let finalRotation = this.facingRight ? -this.tilt : this.tilt;

        if (this.model.type === 'shrimp') {
          finalRotation = this.isClimbing ? (this.facingRight ? -22 : 22) : 0;
        } else if (isNight) {
          finalRotation *= 0.32; // Neutral buoyancy equilibrium posture
        } else if (isChineseGold && !hasFood) {
          finalRotation += Math.sin((now + this.x * 8) / 420) * 5.2;
        } else if (isArowana && !hasFood) {
          finalRotation += Math.sin((now + this.x * 6) / 500) * 1.8;
        }

        this.el.style.left = this.x + 'px';
        this.el.style.bottom = (this.y + waveBounce) + 'px';
        this.el.style.transform = `rotate(${finalRotation}deg) ${flip} scale(${this.individualScale.toFixed(2)})`;
      }
    }

    // ─── TOOL SELECTION ───
    function selectTool(toolName) {
      currentTool = toolName;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('tool' + toolName.charAt(0).toUpperCase() + toolName.slice(1));
      if (activeBtn) activeBtn.classList.add('active');

      tank.classList.remove('tool-feed', 'tool-siphon', 'tool-sponge', 'tool-shears');
      tank.classList.add('tool-' + toolName);

      if (toolName === 'feed') updateStatus("Hand Mode: Tap anywhere in the tank to drop food flakes.");
      else if (toolName === 'siphon') updateStatus("Gravel Siphon: Tap or drag along the gravel to vacuum up droppings & debris.");
      else if (toolName === 'sponge') updateStatus("Algae Scraper: Drag across the glass to wipe away green algae spots.");
      else if (toolName === 'shears') updateStatus("Plant Shears: Tap near overgrown plant foliage to prune stems.");
    }

    // ─── TANK CLICK & DRAG INTERACTIONS ───
    tank.addEventListener('pointerdown', handleTankAction);
    tank.addEventListener('pointermove', (e) => {
      if (e.buttons === 1) handleTankAction(e);
    });

    function handleTankAction(e) {
      const rect = tank.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = rect.height - (e.clientY - rect.top);

      if (currentTool === 'feed') {
        dropFood(clickX, clickY);
        playSound('feed');
      } else if (currentTool === 'siphon') {
        triggerSiphonAt(clickX, clickY);
      } else if (currentTool === 'sponge') {
        wipeAlgaeNear(clickX, clickY);
      } else if (currentTool === 'shears') {
        prunePlantsNear(clickX, clickY);
      }
    }

    // ─── SIPHON VACUUM SYSTEM ───
    function triggerSiphonAt(x, y) {
      // Create visual suction effect
      const fx = document.createElement('div');
      fx.className = 'suction-fx';
      fx.style.left = (x - 12) + 'px';
      fx.style.bottom = (y - 12) + 'px';
      tank.appendChild(fx);
      setTimeout(() => fx.remove(), 500);

      let cleaned = false;

      // Vacuum Poop
      for (let i = poopList.length - 1; i >= 0; i--) {
        const p = poopList[i];
        if (Math.hypot(p.x - x, p.y - y) < 45) {
          p.el.remove();
          poopList.splice(i, 1);
          cleaned = true;
        }
      }

      // Vacuum Decaying Pellets on Bottom
      for (let i = foodList.length - 1; i >= 0; i--) {
        const f = foodList[i];
        if (f.y <= 16 && Math.hypot(f.x - x, f.y - y) < 45) {
          f.el.remove();
          foodList.splice(i, 1);
          cleaned = true;
        }
      }

      if (cleaned) {
        playSound('siphon');
        currentClarity = Math.min(100, currentClarity + 2.5);
        updateTelemetry();
        updateStatus("Siphon cleaned substrate waste! Water clarity improving.");
      }
    }

    // ─── ALGAE SCRAPER SYSTEM ───
    function spawnAlgaePatch() {
      if (algaePatches.length >= 24) return;
      const rect = tank.getBoundingClientRect();
      const patch = document.createElement('div');
      patch.className = 'algae-patch';

      const size = 30 + Math.random() * 45;
      const px = 20 + Math.random() * (rect.width - size - 40);
      const py = 20 + Math.random() * (rect.height * 0.85 - size);

      patch.style.width = size + 'px';
      patch.style.height = size + 'px';
      patch.style.left = px + 'px';
      patch.style.bottom = py + 'px';

      algaeOverlay.appendChild(patch);
      algaePatches.push({ el: patch, x: px + size / 2, y: py + size / 2, radius: size / 2 });

      currentAlgae = Math.min(100, (algaePatches.length / 20) * 100);
      algaeOverlay.style.opacity = Math.min(1, currentAlgae / 60);
      updateTelemetry();
    }

    function wipeAlgaeNear(x, y) {
      let wiped = false;
      for (let i = algaePatches.length - 1; i >= 0; i--) {
        const p = algaePatches[i];
        if (Math.hypot(p.x - x, p.y - y) < p.radius + 30) {
          p.el.style.transform = 'scale(0)';
          p.el.style.opacity = '0';
          setTimeout(() => p.el.remove(), 400);
          algaePatches.splice(i, 1);
          wiped = true;
        }
      }

      if (wiped) {
        playSound('scrape');
        currentAlgae = Math.max(0, (algaePatches.length / 20) * 100);
        algaeOverlay.style.opacity = Math.min(1, currentAlgae / 60);
        updateTelemetry();
        updateStatus("Scraped algae from glass! Glass is clean.");
      }
    }

    // ─── PLANT PRUNING ───
    function applyPlantScale() {
      const pLeft = document.getElementById('plantLeft');
      const pRight = document.getElementById('plantRight');
      if (pLeft) {
        pLeft.style.transformOrigin = 'bottom center';
        pLeft.style.transform = `scaleY(${plantGrowthLeft.toFixed(3)}) scaleX(${(0.88 + plantGrowthLeft * 0.12).toFixed(3)})`;
      }
      if (pRight) {
        pRight.style.transformOrigin = 'bottom center';
        pRight.style.transform = `scaleY(${plantGrowthRight.toFixed(3)}) scaleX(${(0.88 + plantGrowthRight * 0.12).toFixed(3)})`;
      }
    }

    function spawnLeafClipping(originX, originY) {
      const clip = document.createElement('div');
      clip.className = 'leaf-clip';
      clip.style.left = originX + 'px';
      clip.style.bottom = originY + 'px';
      tank.appendChild(clip);

      let px = originX;
      let py = originY;
      let fallSpeed = 0.6 + Math.random() * 0.4;
      let wobble = Math.random() * Math.PI * 2;
      let rot = Math.random() * 360;

      const anim = () => {
        py -= fallSpeed;
        wobble += 0.08;
        px += Math.sin(wobble) * 0.6;
        rot += 2.5;

        clip.style.bottom = py + 'px';
        clip.style.left = px + 'px';
        clip.style.transform = `rotate(${rot}deg)`;

        if (py <= 16) {
          // Reached substrate, dissolve after settling
          setTimeout(() => {
            clip.style.transition = 'opacity 1s';
            clip.style.opacity = '0';
            setTimeout(() => clip.remove(), 1000);
          }, 2000);
          return;
        }
        requestAnimationFrame(anim);
      };
      requestAnimationFrame(anim);
    }

    function prunePlantsNear(x, y) {
      const rect = tank.getBoundingClientRect();
      const nearLeft = (x < rect.width * 0.32 && y < rect.height * 0.85);
      const nearRight = (x > rect.width * 0.68 && y < rect.height * 0.85);

      if (nearLeft || nearRight) {
        playSound('snip');
        if (nearLeft) {
          if (plantGrowthLeft > 0.65) {
            plantGrowthLeft = Math.max(0.60, plantGrowthLeft - 0.16);
            for (let i = 0; i < 3; i++) {
              spawnLeafClipping(x + (Math.random() * 20 - 10), y + (Math.random() * 15 - 5));
            }
            updateStatus(`Pruned Left Stem Plant down to ${(plantGrowthLeft * 100).toFixed(0)}% height. It will regrow slowly in daylight.`);
          } else {
            updateStatus("Left plant is already trimmed down to base height. Give it time to regrow!");
          }
        } else if (nearRight) {
          if (plantGrowthRight > 0.65) {
            plantGrowthRight = Math.max(0.60, plantGrowthRight - 0.16);
            for (let i = 0; i < 3; i++) {
              spawnLeafClipping(x + (Math.random() * 20 - 10), y + (Math.random() * 15 - 5));
            }
            updateStatus(`Pruned Right Fern Plant down to ${(plantGrowthRight * 100).toFixed(0)}% height. It will regrow slowly in daylight.`);
          } else {
            updateStatus("Right plant is already trimmed down to base height. Give it time to regrow!");
          }
        }

        applyPlantScale();
        saveEcologyState();
      }
    }

    // ─── WATER CHANGE MECHANISM ───
    function performWaterChange() {
      const drainFx = document.getElementById('waterDrainFx');
      drainFx.style.opacity = '1';
      playSound('water');
      updateStatus("Water Change: Draining old water and refilling with fresh pristine water...");

      setTimeout(() => {
        currentClarity = 100.0;
        currentO2 = Math.max(currentO2, 98.0);
        currentTemp = 25.4;
        drainFx.style.opacity = '0';
        updateHeaterUI();
      updateOxygenUI();
      updateTelemetry();
        updateStatus("Water change complete! 30% fresh water added. Water is pristine.");
      }, 1000);
    }

    // ─── FEEDING & POOP ───
    function dropFood(x, y) {
      const pellet = document.createElement('div');
      pellet.className = 'food-pellet';
      pellet.style.left = x + 'px';
      pellet.style.bottom = y + 'px';
      tank.appendChild(pellet);

      const foodObj = {
        x: x,
        y: y,
        el: pellet,
        fallSpeed: 0.5 + Math.random() * 0.35,
        driftPhase: Math.random() * Math.PI * 2,
        driftSpeed: 0.04 + Math.random() * 0.03,
        onFloorTime: 0
      };
      foodList.push(foodObj);
    }

    function spawnPoop(x, y) {
      const poop = document.createElement('div');
      poop.className = 'fish-poop';
      poop.style.left = x + 'px';
      poop.style.bottom = y + 'px';
      tank.appendChild(poop);

      const poopObj = {
        x: x,
        y: y,
        el: poop,
        fallSpeed: 0.75 + Math.random() * 0.3
      };
      poopList.push(poopObj);

      // Trace bio-waste added to substrate
      currentClarity = Math.max(25, currentClarity - 0.15);
      saveEcologyState();
      updateTelemetry();
    }

    function eatFoodNear(fx, fy, hitRadius = 24) {
      for (let i = foodList.length - 1; i >= 0; i--) {
        let f = foodList[i];
        if (Math.hypot(f.x - fx, f.y - fy) < hitRadius) {
          f.el.remove();
          foodList.splice(i, 1);

          fishList.forEach(fish => {
            if (Math.hypot(fish.x - fx, fish.y - fy) < 80) {
              fish.disperseImmediately();
            }
          });
        }
      }
    }

    function spawnBubble(x, y) {
      const rect = tank.getBoundingClientRect();
      const waterHeight = rect.height * 0.94;
      if ((y + 10) >= waterHeight) return;

      const bubble = document.createElement('div');
      bubble.className = 'tank-bubble';
      const startBottom = y + 6;
      const maxTravel = Math.min(30, Math.max(18, waterHeight - startBottom - 4));

      bubble.style.left = x + 'px';
      bubble.style.bottom = startBottom + 'px';
      tank.appendChild(bubble);

      const startTime = Date.now();
      const duration = 900;

      const animateBubble = () => {
        const elapsed = Date.now() - startTime;
        const progress = elapsed / duration;
        if (progress >= 1 || !bubble.parentElement) {
          if (bubble.parentElement) bubble.remove();
          return;
        }
        bubble.style.bottom = (startBottom + progress * maxTravel) + 'px';
        bubble.style.opacity = (1 - progress).toFixed(2);
        requestAnimationFrame(animateBubble);
      };
      requestAnimationFrame(animateBubble);
    }

    // ─── EQUIPMENT TOGGLES & PERSISTENT BUTTON STYLES ───
    function updateHeaterUI() {
      const heaterEl = document.getElementById('heaterFixture');
      const heaterBtn = document.getElementById('heaterToggleBtn');
      if (heaterActive) {
        if (heaterEl) heaterEl.classList.remove('heater-off');
        if (heaterBtn) {
          heaterBtn.innerHTML = `<span>🔥</span> Heater: ON`;
          heaterBtn.className = "action-btn heater-btn-on";
        }
      } else {
        if (heaterEl) heaterEl.classList.add('heater-off');
        if (heaterBtn) {
          heaterBtn.innerHTML = `<span>🔥</span> Heater: OFF`;
          heaterBtn.className = "action-btn heater-btn-off";
        }
      }
    }

    function toggleHeater() {
      heaterActive = !heaterActive;
      localStorage.setItem('aqua_heater', heaterActive ? 'true' : 'false');
      updateHeaterUI();
      if (heaterActive) {
        updateStatus("Heater enabled. Regulating optimal temperature at 25.4°C.");
      } else {
        updateStatus("Heater switched off. Water temperature will slowly cool down.");
      }
      updateTelemetry();
    }

    function updateOxygenUI() {
      const btn = document.getElementById('airPumpBtn');
      const diffuser = document.getElementById('airstoneFixture');
      if (airPumpActive) {
        if (btn) {
          btn.innerHTML = `<span>💨</span> Oxygen: ON`;
          btn.className = "action-btn oxygen-btn-on";
        }
        if (diffuser) diffuser.style.opacity = '1.0';
      } else {
        if (btn) {
          btn.innerHTML = `<span>💨</span> Oxygen: OFF`;
          btn.className = "action-btn oxygen-btn-off";
        }
        if (diffuser) diffuser.style.opacity = '0.35';
      }
    }

    function toggleAirPump() {
      airPumpActive = !airPumpActive;
      localStorage.setItem('aqua_airpump', airPumpActive ? 'true' : 'false');
      updateOxygenUI();
      if (airPumpActive) {
        updateStatus("Air pump on: Oxygen bubbling restored.");
      } else {
        updateStatus("Warning: Air pump turned off. Oxygen levels will drop!");
      }
      updateTelemetry();
    }

    function spawnMicroOxygenBubble() {
      if (!airPumpActive) return;
      const diffuser = document.getElementById('airstoneFixture');
      if (!diffuser) return;

      const rect = tank.getBoundingClientRect();
      const diffRect = diffuser.getBoundingClientRect();
      const originX = (diffRect.left - rect.left) + 12 + (Math.random() * 8 - 4);
      const originY = 22;

      const bubble = document.createElement('div');
      bubble.className = 'air-micro-bubble';
      const size = 2 + Math.random() * 2.5;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = originX + 'px';
      bubble.style.bottom = originY + 'px';
      tank.appendChild(bubble);

      microBubbleList.push({
        el: bubble,
        x: originX,
        y: originY,
        vx: (Math.random() - 0.5) * 0.4,
        vy: 1.8 + Math.random() * 0.8,
        wobble: Math.random() * 10
      });
    }

    setInterval(() => {
      if (airPumpActive) {
        spawnMicroOxygenBubble();
        if (Math.random() < 0.6) spawnMicroOxygenBubble();
      }
    }, 110);

    // ─── REAL-TIME ECOLOGICAL SIMULATION ENGINE (DAYS-LONG PACE) ───
    function cyclePacingMode() {
      pacingIndex = (pacingIndex + 1) % PACING_MODES.length;
      localStorage.setItem('aqua_pace_index', pacingIndex);
      updatePacingUI();
      updateStatus(`Pacing changed: ${PACING_MODES[pacingIndex].desc}`);
    }

    function updatePacingUI() {
      const chip = document.getElementById('chipPace');
      const val = document.getElementById('valPace');
      if (val) val.innerText = PACING_MODES[pacingIndex].label;
      if (chip) {
        chip.style.borderColor = (pacingIndex === 0) ? 'rgba(0, 210, 255, 0.4)' : (pacingIndex === 1 ? 'rgba(245, 158, 11, 0.5)' : 'rgba(239, 68, 68, 0.5)');
      }
    }

    function saveEcologyState() {
      localStorage.setItem('aqua_last_ts', Date.now());
      localStorage.setItem('aqua_temp', currentTemp.toFixed(2));
      localStorage.setItem('aqua_o2', currentO2.toFixed(1));
      localStorage.setItem('aqua_clarity', currentClarity.toFixed(1));
      localStorage.setItem('aqua_algae', currentAlgae.toFixed(1));
      localStorage.setItem('aqua_heater', heaterActive ? 'true' : 'false');
      localStorage.setItem('aqua_airpump', airPumpActive ? 'true' : 'false');
      localStorage.setItem('aqua_sound', soundEnabled ? 'true' : 'false');
      localStorage.setItem('aqua_poop_count', poopList.length);
      localStorage.setItem('aqua_plant_left', plantGrowthLeft.toFixed(3));
      localStorage.setItem('aqua_plant_right', plantGrowthRight.toFixed(3));
    }

    // Offline Time Catch-Up: calculates realistic changes elapsed while tab was closed
    function applyOfflineTimeCatchUp() {
      const savedTs = parseInt(localStorage.getItem('aqua_last_ts') || '0', 10);
      if (savedTs <= 0) return;

      const elapsedSeconds = (Date.now() - savedTs) / 1000;
      if (elapsedSeconds <= 5) return; // Negligible reload

      const elapsedHours = elapsedSeconds / 3600;
      const speed = PACING_MODES[pacingIndex].speed;
      const effectiveHours = elapsedHours * speed;

      // 1. Water Clarity: naturally drops ~5% per 24 hours of uncleaned biowaste
      const clarityDecayPerDay = 5.0; // 5% per 24h
      const clarityLost = (effectiveHours / 24.0) * clarityDecayPerDay;
      currentClarity = Math.max(25.0, currentClarity - clarityLost);

      // 2. Algae Growth: under daylight, 1 patch appears every 6-8 hours
      if (currentLightIndex === 0) {
        const newAlgaePatches = Math.min(6, Math.floor(effectiveHours / 6.5));
        for (let i = 0; i < newAlgaePatches; i++) {
          spawnAlgaePatch();
        }
      }

      // 2b. Plant Regrowth while away (takes days to grow tall)
      if (currentLightIndex === 0 && effectiveHours > 0) {
        const growthGained = (effectiveHours / 24.0) * 0.10; // ~10% growth per 24 hours of light
        plantGrowthLeft = Math.min(1.22, plantGrowthLeft + growthGained);
        plantGrowthRight = Math.min(1.20, plantGrowthRight + growthGained * 0.9);
        applyPlantScale();
      }

      // 3. Temperature drift
      if (!heaterActive) {
        // Cooled to ambient over 4-6 hours
        const coolFactor = Math.min(1.0, effectiveHours / 5.0);
        currentTemp = 25.4 - (coolFactor * (25.4 - 19.5));
      }

      // 4. Oxygen drift
      if (!airPumpActive) {
        // Depleted over 3 hours
        const o2Factor = Math.min(1.0, effectiveHours / 3.0);
        currentO2 = Math.max(22.0, 98.0 - (o2Factor * 76.0));
      }

      // 5. Restore saved poops
      const savedPoopCount = Math.min(6, parseInt(localStorage.getItem('aqua_poop_count') || '0', 10));
      const rect = tank.getBoundingClientRect();
      for (let i = 0; i < savedPoopCount; i++) {
        spawnPoop(30 + Math.random() * (rect.width - 60), 14);
      }

      saveEcologyState();
    }

    // Active Simulation Loop (Evaluated every 3 seconds)
    setInterval(() => {
      const now = Date.now();
      const dtSeconds = (now - lastSimTimestamp) / 1000;
      lastSimTimestamp = now;

      const speed = PACING_MODES[pacingIndex].speed;
      // In Real-Time (1x): 24h = 86400s. In 3 seconds, dtRatio represents (3 * speed / 86400) of a day!
      const simDayFraction = (dtSeconds * speed) / 86400.0;

      // 1. Temperature Physics
      if (heaterActive) {
        // Reaches optimal 25.4°C and stays stable with micro-variations
        const delta = (25.4 - currentTemp) * 0.15 + (Math.random() - 0.5) * 0.02;
        currentTemp += delta;
      } else {
        // Slowly cools to 19.5°C over ~4 hours in real time
        const coolRatePerDay = 24.0; // drops ~5.9°C over 6 hours (24°C/day)
        currentTemp = Math.max(19.5, currentTemp - (simDayFraction * coolRatePerDay));
      }

      // 2. Dissolved Oxygen Physics
      if (airPumpActive) {
        // Aeration recovers efficiently
        currentO2 = Math.min(100.0, currentO2 + 0.6);
      } else {
        // Stagnant water oxygen drops over ~3 hours in real time
        const o2LossPerDay = (76.0 / (3.0 / 24.0)); // 76% lost in 3 hours
        currentO2 = Math.max(22.0, currentO2 - (simDayFraction * o2LossPerDay));
      }

      // 3. Water Clarity Physics: takes 5-7 days to get cloudy if neglected
      const dailyClarityLoss = 4.5 + (poopList.length * 0.4); // ~5-8% per day
      currentClarity = Math.max(25.0, currentClarity - (simDayFraction * dailyClarityLoss));

      // 4. Algae Growth Physics: under daylight, 1 patch every ~7 hours in real time
      if (currentLightIndex === 0) {
        const algaeChance = (dtSeconds * speed) / (7.0 * 3600.0);
        if (Math.random() < algaeChance) {
          spawnAlgaePatch();
        }

        // 5. Plant Regrowth Physics in Daylight (grows ~12% height per 24 hours)
        const dailyGrowth = 0.12;
        if (plantGrowthLeft < 1.25) {
          plantGrowthLeft = Math.min(1.25, plantGrowthLeft + (simDayFraction * dailyGrowth));
        }
        if (plantGrowthRight < 1.20) {
          plantGrowthRight = Math.min(1.20, plantGrowthRight + (simDayFraction * dailyGrowth * 0.85));
        }
        applyPlantScale();
      }

      saveEcologyState();
      updateTelemetry();
    }, 3000);

    function updateTelemetry() {
      // Update Temp
      const valTemp = document.getElementById('valTemp');
      const chipTemp = document.getElementById('chipTemp');
      if (valTemp) valTemp.innerText = currentTemp.toFixed(1) + "°C";
      if (chipTemp) {
        chipTemp.className = 'telemetry-chip';
        if (currentTemp < 21.5) chipTemp.classList.add('alert');
        else if (currentTemp < 23.5) chipTemp.classList.add('warn');
      }

      // Update O2
      const valO2 = document.getElementById('valO2');
      const chipO2 = document.getElementById('chipO2');
      if (valO2) valO2.innerText = Math.round(currentO2) + "%";
      if (chipO2) {
        chipO2.className = 'telemetry-chip';
        if (currentO2 < 45) chipO2.classList.add('alert');
        else if (currentO2 < 70) chipO2.classList.add('warn');
      }

      // Update Clarity
      const valClarity = document.getElementById('valClarity');
      const chipClarity = document.getElementById('chipClarity');
      if (valClarity) valClarity.innerText = Math.round(currentClarity) + "%";
      if (chipClarity) {
        chipClarity.className = 'telemetry-chip';
        if (currentClarity < 50) chipClarity.classList.add('alert');
        else if (currentClarity < 75) chipClarity.classList.add('warn');
      }

      // Update Algae
      const valAlgae = document.getElementById('valAlgae');
      const chipAlgae = document.getElementById('chipAlgae');
      if (valAlgae) valAlgae.innerText = Math.round(currentAlgae) + "%";
      if (chipAlgae) {
        chipAlgae.className = 'telemetry-chip';
        if (currentAlgae > 65) chipAlgae.classList.add('alert');
        else if (currentAlgae > 35) chipAlgae.classList.add('warn');
      }

      // Water Murk Visual Sync
      if (waterMurkEl) {
        const murkOpacity = Math.max(0, (100 - currentClarity) / 100 * 0.75);
        waterMurkEl.style.opacity = murkOpacity.toFixed(2);
      }
    }

    function updateStatus(text) {
      if (statusPanel) statusPanel.innerText = text;
    }

    // ─── LIGHTING SPECTRUM MODES ───
    const LIGHT_MODES = [
      { id: 'daylight', label: 'Daylight', cssClass: '' },
      { id: 'sunset', label: 'Sunset', cssClass: 'light-sunset' },
      { id: 'moonlight', label: 'Moonlight', cssClass: 'light-moonlight' },
      { id: 'off', label: 'Dark / Night', cssClass: 'light-off' }
    ];

    let currentLightIndex = parseInt(localStorage.getItem('aqua_light_mode') || '0', 10);

    function updateLightUI() {
      const mode = LIGHT_MODES[currentLightIndex];
      const btnEl = document.getElementById('lightModeBtn');
      if (!btnEl) return;
      
      btnEl.className = "action-btn";
      if (mode.id === 'daylight') {
        btnEl.innerHTML = `<span>💡</span> Light: Daylight`;
        btnEl.classList.add('light-btn-daylight');
      } else if (mode.id === 'sunset') {
        btnEl.innerHTML = `<span>🌇</span> Light: Sunset`;
        btnEl.classList.add('light-btn-sunset');
      } else if (mode.id === 'moonlight') {
        btnEl.innerHTML = `<span>🌙</span> Light: Moonlight`;
        btnEl.classList.add('light-btn-moonlight');
      } else {
        btnEl.innerHTML = `<span>🌑</span> Light: Off`;
        btnEl.classList.add('light-btn-off');
      }
    }

    function applyLightingPreset() {
      const mode = LIGHT_MODES[currentLightIndex];
      const assembly = document.querySelector('.aquarium-assembly');
      if (!assembly) return;

      LIGHT_MODES.forEach(m => {
        if (m.cssClass) assembly.classList.remove(m.cssClass);
      });

      if (mode.cssClass) assembly.classList.add(mode.cssClass);
      updateLightUI();
      localStorage.setItem('aqua_light_mode', currentLightIndex);
    }

    function cycleLightMode() {
      currentLightIndex = (currentLightIndex + 1) % LIGHT_MODES.length;
      applyLightingPreset();
      if (currentLightIndex === 3) {
        updateStatus("🌙 Night mode: Lights off. Fish settle peacefully into bottom shelter for sleep-resting torpor.");
        fishList.forEach(f => f.pickNewTarget());
      } else {
        updateStatus(`Lighting spectrum switched to ${LIGHT_MODES[currentLightIndex].label}. Fish wake up and resume cruising.`);
        fishList.forEach(f => f.pickNewTarget());
      }
    }

    // ─── SPECIES POPULATION CONTROLLER ───
    const DEFAULT_POPULATION = { 0: 2, 1: 2, 2: 3, 3: 2, 4: 2, 5: 3, 6: 2, 7: 3, 8: 1, 9: 2 };
    let populationCounts = JSON.parse(localStorage.getItem('aqua_population') || 'null') || DEFAULT_POPULATION;

    if (populationCounts[8] === undefined) populationCounts[8] = 1;
    if (populationCounts[9] === undefined) populationCounts[9] = 2;

    function savePopulationSettings() {
      localStorage.setItem('aqua_population', JSON.stringify(populationCounts));
    }

    function toggleSpeciesMenu() {
      const menu = document.getElementById('speciesDropdown');
      if (menu) menu.classList.toggle('open');
    }

    document.addEventListener('pointerdown', (e) => {
      const menu = document.getElementById('speciesDropdown');
      const btn = document.getElementById('speciesMenuBtn');
      if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
      }
    });

    function renderSpeciesDropdown() {
      const container = document.getElementById('speciesList');
      if (!container) return;
      container.innerHTML = '';

      const speciesDisplayNames = [
        "Golden Fantail",
        "Graceful Angelfish",
        "Neon Tetra",
        "Ocellaris Clownfish",
        "Corydoras Catfish",
        "Red Cherry Shrimp",
        "Chinese Yuanbao Goldfish",
        "Tiger Barb (Tiger Fish)",
        "Super Red Dragon Arowana",
        "Otocinclus Algae Eater"
      ];

      FISH_MODELS.forEach((model, idx) => {
        const count = populationCounts[idx] || 0;
        const isEnabled = count > 0;

        const row = document.createElement('div');
        row.className = 'species-item';
        row.innerHTML = `
          <label class="species-info" for="chk_${idx}">
            <input type="checkbox" id="chk_${idx}" class="species-checkbox" ${isEnabled ? 'checked' : ''} onchange="toggleSpeciesChecked(${idx}, this.checked)">
            <div class="species-preview">${model.svg}</div>
            <div class="species-name">${speciesDisplayNames[idx]}</div>
          </label>
          <div class="qty-stepper">
            <button class="stepper-btn" onclick="changeSpeciesCount(${idx}, -1)">−</button>
            <span class="stepper-val" id="count_${idx}">${count}</span>
            <button class="stepper-btn" onclick="changeSpeciesCount(${idx}, 1)">+</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function toggleSpeciesChecked(idx, checked) {
      if (checked) {
        if (!populationCounts[idx] || populationCounts[idx] === 0) populationCounts[idx] = 1;
      } else {
        populationCounts[idx] = 0;
      }
      savePopulationSettings();
      syncFishPopulation();
      renderSpeciesDropdown();
    }

    function changeSpeciesCount(idx, delta) {
      const current = populationCounts[idx] || 0;
      const next = Math.max(0, Math.min(10, current + delta));
      populationCounts[idx] = next;
      savePopulationSettings();
      syncFishPopulation();
      renderSpeciesDropdown();
    }

    function syncFishPopulation() {
      const rect = tank.getBoundingClientRect();
      const waterHeight = rect.height * 0.94;

      FISH_MODELS.forEach((_, modelIdx) => {
        const targetCount = populationCounts[modelIdx] || 0;
        const currentOfModel = fishList.filter(f => f.modelIndex === modelIdx);

        if (currentOfModel.length < targetCount) {
          const toAdd = targetCount - currentOfModel.length;
          for (let i = 0; i < toAdd; i++) {
            let startY;
            if (FISH_MODELS[modelIdx].type === 'shrimp') {
              startY = 12 + Math.random() * 4;
            } else if (FISH_MODELS[modelIdx].isSurfaceDweller) {
              startY = waterHeight - FISH_MODELS[modelIdx].height - 18 - Math.random() * 20;
            } else {
              startY = 25 + Math.random() * (waterHeight * 0.8);
            }
            const f = new Fish(modelIdx, 40 + Math.random() * (rect.width - 100), startY);
            fishList.push(f);
          }
        } else if (currentOfModel.length > targetCount) {
          const toRemove = currentOfModel.length - targetCount;
          for (let i = 0; i < toRemove; i++) {
            const victim = currentOfModel[i];
            victim.el.remove();
            const listIdx = fishList.indexOf(victim);
            if (listIdx > -1) fishList.splice(listIdx, 1);
          }
        }
      });
    }

    window.addEventListener('resize', () => {
      const rect = tank.getBoundingClientRect();
      const waterHeight = rect.height * 0.94;
      fishList.forEach(fish => {
        fish.x = Math.max(10, Math.min(rect.width - fish.model.width - 10, fish.x));
        fish.y = Math.max(12, Math.min(waterHeight - fish.model.height - 8, fish.y));
      });
    });

    // ─── SETUP & RENDER LOOP ───
    function setupTank() {
      fishList.forEach(f => f.el.remove());
      fishList = [];
      syncFishPopulation();
      renderSpeciesDropdown();
      applyLightingPreset();
      updateHeaterUI();
      updateOxygenUI();
      updatePacingUI();
      applyOfflineTimeCatchUp();
      applyPlantScale();
      updateTelemetry();
    }

    function render() {
      fishList.forEach(f => f.update());

      // Sinking Food Pellets Physics
      for (let i = foodList.length - 1; i >= 0; i--) {
        let f = foodList[i];

        if (f.y > 14) {
          f.driftPhase += f.driftSpeed;
          f.x += Math.sin(f.driftPhase) * 0.35;
          f.el.style.left = f.x + 'px';
        }

        f.y -= f.fallSpeed;
        f.el.style.bottom = f.y + 'px';

        if (f.y <= 14) {
          f.y = 14;
          // Bottom scavengers (Corydoras & Shrimp) feed on substrate
          fishList.forEach(fish => {
            if (fish.model.isBottomDweller && Math.hypot(fish.x - f.x, fish.y - f.y) < 130) {
              fish.targetX = f.x - (fish.model.width / 2);
              fish.targetY = 14;
              fish.speed = fish.model.speedMax * 1.8;
              fish.pauseFrames = 0;
            }
          });

          // Uneaten food decays and turns brown on the substrate
          f.onFloorTime++;
          if (f.onFloorTime === 60) {
            f.el.classList.add('decaying');
          }
        }
      }

      // Sinking Fish Poop Physics
      for (let i = poopList.length - 1; i >= 0; i--) {
        let p = poopList[i];
        if (p.y > 14) {
          p.y -= p.fallSpeed;
          p.el.style.bottom = p.y + 'px';
        } else {
          p.y = 14;
          p.el.style.bottom = '14px';
        }
      }

      // Rising Micro-Bubbles
      const tankRect = tank.getBoundingClientRect();
      const waterCeiling = (tankRect.height * 0.94) - 4;

      for (let i = microBubbleList.length - 1; i >= 0; i--) {
        let b = microBubbleList[i];
        b.y += b.vy;
        b.wobble += 0.12;
        b.x += Math.sin(b.wobble) * 0.45;

        b.el.style.bottom = b.y + 'px';
        b.el.style.left = b.x + 'px';

        if (b.y >= waterCeiling) {
          b.el.remove();
          microBubbleList.splice(i, 1);
        }
      }

      requestAnimationFrame(render);
    }

    setupTank();
    requestAnimationFrame(render);
  </script>
